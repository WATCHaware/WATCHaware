<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>WATCHaware</title>
  <meta name="description" content="Passive health monitoring for the people you love." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif; }
    .page {
      min-height: 100vh;
      background-image: url('/bg-index.png');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 52px 32px 48px;
    }
    .logo {
      text-align: center;
    }
    .logo-mark {
      font-size: 32px;
      line-height: 1;
      letter-spacing: 2px;
      color: #4A4A4A;
    }
    .logo-mark span { font-weight: 800; }
    .logo-mark em   { font-weight: 300; font-style: italic; }
    .logo-sub {
      font-size: 11px;
      color: #8C8C8C;
      letter-spacing: 2.5px;
      margin-top: 5px;
      text-transform: uppercase;
    }
    .spacer { flex: 1; }
    .buttons {
      display: flex;
      flex-direction: row;
      gap: 14px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 20px;
    }
    .btn {
      flex: 1;
      display: block;
      padding: 18px 0;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      /* Glass effect */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.5);
    }
    .btn:active {
      opacity: 0.85;
      transform: scale(0.97);
    }
    .btn-patient {
      background: linear-gradient(135deg, rgba(209,131,92,0.55), rgba(209,131,92,0.35));
      color: #4A4A4A;
      box-shadow: 0 4px 24px rgba(209,131,92,0.2), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .btn-care {
      background: linear-gradient(135deg, rgba(168,195,179,0.55), rgba(168,195,179,0.35));
      color: #4A4A4A;
      box-shadow: 0 4px 24px rgba(168,195,179,0.2), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .footer {
      font-size: 10px;
      color: #AAAAAA;
      letter-spacing: 1.5px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="logo">
      <div class="logo-mark"><span>WATCH</span><em>aware</em></div>
      <div class="logo-sub">Health Monitoring</div>
    </div>

    <div class="spacer"></div>

    <div class="buttons">
      <a href="/patient" class="btn btn-patient">I am the<br/>patient</a>
      <a href="/care" class="btn btn-care">I am a<br/>caregiver</a>
    </div>
    <div class="footer">WATCHAWARE · PRIVATE &amp; SECURE</div>
  </div>
</body>
</html>
