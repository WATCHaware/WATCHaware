[build]
  command = "npm run build && cp public/index.html build/landing.html && mv build/index.html build/app.html"
  publish = "build"
  functions = "netlify/functions"

[functions.daily-report]
  schedule = "0 12 * * *"

[[redirects]]
  from = "/patient"
  to = "/app.html?view=patient"
  status = 200
  force = true

[[redirects]]
  from = "/care"
  to = "/app.html?view=caretaker"
  status = 200
  force = true

[[redirects]]
  from = "/app.html"
  to = "/app.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/landing.html"
  status = 200

