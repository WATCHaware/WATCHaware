[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[functions.daily-report]
  schedule = "0 12 * * *"

[[redirects]]
  from = "/patient"
  to = "/app.html?view=patient"
  status = 200

[[redirects]]
  from = "/care"
  to = "/app.html?view=caretaker"
  status = 200

[[redirects]]
  from = "/app.html"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200